<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>League Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b1220;
    --surface: #121b2e;
    --surface-2: #1a2540;
    --line: rgba(255,255,255,0.08);
    --text: #f1f3f6;
    --text-dim: #93a0b8;
    --text-faint: #5c6a86;
    --accent: #f4b93e;
    --accent-dim: #7a601f;
    --tier-s: #f4b93e;
    --tier-a: #6fd08c;
    --tier-b: #6fb0f4;
    --tier-c: #93a0b8;
    --tier-d: #d98a5f;
    --tier-f: #e0616f;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    line-height: 1.6;
  }

  h1, h2, h3, .display {
    font-family: 'Oswald', sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    margin: 0;
  }

  .mono {
    font-family: 'IBM Plex Mono', monospace;
  }

  a { color: var(--accent); }

  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 20px;
  }

  header {
    border-bottom: 1px solid var(--line);
    padding: 28px 0 20px;
  }

  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 12px;
  }

  .eyebrow {
    color: var(--accent);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  h1 {
    font-size: 34px;
    font-weight: 700;
    color: var(--text);
  }

  .meta {
    text-align: right;
    color: var(--text-dim);
    font-size: 13px;
    font-family: 'IBM Plex Mono', monospace;
  }

  .ticker-outer {
    background: var(--surface-2);
    border-bottom: 1px solid var(--line);
    overflow: hidden;
    white-space: nowrap;
    position: relative;
  }

  .ticker-outer::before,
  .ticker-outer::after {
    content: "";
    position: absolute;
    top: 0; bottom: 0;
    width: 40px;
    z-index: 2;
    pointer-events: none;
  }
  .ticker-outer::before { left: 0; background: linear-gradient(90deg, var(--surface-2), transparent); }
  .ticker-outer::after { right: 0; background: linear-gradient(270deg, var(--surface-2), transparent); }

  .ticker-track {
    display: inline-flex;
    align-items: center;
    animation: scroll-left 45s linear infinite;
    padding: 10px 0;
  }

  .ticker-track:hover { animation-play-state: paused; }

  .ticker-item {
    display: inline-flex;
    align-items: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--text);
    padding: 0 28px;
  }

  .ticker-item .dot {
    color: var(--accent);
    margin-right: 10px;
  }

  @keyframes scroll-left {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }

  section { padding: 36px 0; }
  section + section { border-top: 1px solid var(--line); }

  .section-title {
    font-size: 13px;
    letter-spacing: 0.14em;
    color: var(--text-faint);
    margin-bottom: 18px;
  }

  .news-grid {
    display: grid;
    gap: 14px;
  }

  .news-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: 4px;
    padding: 18px 20px;
  }

  .news-card.custom { border-left-color: var(--tier-b); }

  .news-headline {
    font-family: 'Oswald', sans-serif;
    font-size: 19px;
    font-weight: 600;
    text-transform: none;
    letter-spacing: 0;
    margin-bottom: 8px;
    color: var(--text);
  }

  .news-body {
    color: var(--text-dim);
    font-size: 14.5px;
    margin: 0;
  }

  .news-tag {
    display: inline-block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
  }

  .two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
  }
  .two-col.wide-left { grid-template-columns: 1.3fr 1fr; }
  @media (max-width: 720px) { .two-col.wide-left { grid-template-columns: 1fr; } }

  @media (max-width: 720px) {
    .two-col { grid-template-columns: 1fr; }
    h1 { font-size: 26px; }
    .header-row { flex-direction: column; align-items: flex-start; }
    .meta { text-align: left; }
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
  }

  th {
    text-align: left;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-faint);
    font-weight: 500;
    padding: 8px 6px;
    border-bottom: 1px solid var(--line);
  }

  td {
    padding: 9px 6px;
    border-bottom: 1px solid var(--line);
    color: var(--text);
  }

  td.num, th.num { text-align: right; font-family: 'IBM Plex Mono', monospace; }

  .team-cell {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .rank-badge {
    font-family: 'IBM Plex Mono', monospace;
    color: var(--text-faint);
    width: 18px;
    display: inline-block;
  }

  .tier-chip {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    border-radius: 3px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    color: var(--bg);
  }

  .tier-S { background: var(--tier-s); }
  .tier-A { background: var(--tier-a); }
  .tier-B { background: var(--tier-b); }
  .tier-C { background: var(--tier-c); color: var(--bg); }
  .tier-D { background: var(--tier-d); }
  .tier-F { background: var(--tier-f); }

  .empty-state {
    color: var(--text-faint);
    font-size: 14px;
    font-style: italic;
    padding: 8px 0;
  }

  .action-tag {
    display: inline-flex;
    align-items: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 3px 7px;
    border-radius: 3px;
    background: var(--surface-2);
    color: var(--text-dim);
    white-space: nowrap;
  }

  .action-tag.add { color: var(--tier-a); }
  .action-tag.drop { color: var(--tier-f); }
  .action-tag.trade { color: var(--tier-b); }

  /* ---- DonBot tweet cards ---- */
  .tweet {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px 10px;
    display: grid;
    grid-template-columns: 48px 1fr;
    gap: 12px;
  }
  .tweet-avatar { width: 48px; height: 48px; border-radius: 50%; overflow: hidden; background: #1d9bf0; }
  .tweet-avatar svg { width: 100%; height: 100%; display: block; }
  .tweet-head { display: flex; align-items: center; gap: 5px; font-size: 14.5px; flex-wrap: wrap; }
  .tweet-name { font-weight: 700; color: var(--text); }
  .tweet-check { width: 16px; height: 16px; flex: none; }
  .tweet-handle { color: var(--text-faint); }
  .tweet-text { margin: 4px 0 0; font-size: 15px; line-height: 1.45; color: var(--text); white-space: pre-line; }
  .tweet-text .lead { display: block; font-weight: 600; margin-bottom: 4px; }
  .tweet-actions { display: flex; justify-content: space-between; max-width: 360px; margin-top: 10px; color: var(--text-faint); font-size: 12.5px; }
  .tweet-actions span { display: inline-flex; align-items: center; gap: 6px; }
  .tweet-actions svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; }
  .ticker-item .handle { color: #1d9bf0; margin-right: 6px; }

  /* ---- power ranking trends ---- */
  .delta { font-family: 'IBM Plex Mono', monospace; white-space: nowrap; }
  .delta.up { color: var(--tier-a); }
  .delta.down { color: var(--tier-f); }
  .delta.flat { color: var(--text-faint); }
  .delta .spots { font-size: 10.5px; opacity: 0.8; margin-left: 4px; }

  /* ---- transactions ---- */
  .txn-sub { color: var(--text-faint); font-size: 12px; }
  .txn-add { color: var(--tier-a); }
  .txn-drop { color: var(--tier-f); }
  .txn-line + .txn-line { margin-top: 3px; }
  .txn-bid { color: var(--text-faint); font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; margin-left: 6px; }

  /* ---- team identity ---- */
  .team { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
  .team-logo { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; background: var(--surface-2); flex: none; }
  .team-logo.blank { display: inline-flex; align-items: center; justify-content: center; font: 600 9px 'IBM Plex Mono', monospace; color: var(--text-faint); }
  .crown { margin-left: 2px; cursor: help; }

  /* ---- weekly awards ---- */
  .awards-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .award {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 14px 14px 12px;
    transition: transform .15s ease, border-color .15s ease;
  }
  .award:hover { transform: translateY(-2px); border-color: var(--accent-dim); }
  .award-top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .award-icon { font-size: 20px; line-height: 1; }
  .award-title { font-family: 'Oswald', sans-serif; font-size: 14px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); }
  .award.bad .award-title { color: var(--tier-f); }
  .award-team { font-weight: 600; font-size: 14px; }
  .award-value { font-family: 'IBM Plex Mono', monospace; font-size: 18px; margin: 4px 0 2px; }
  .award-detail { color: var(--text-faint); font-size: 12px; line-height: 1.4; }
  @media (max-width: 900px) { .awards-grid { grid-template-columns: repeat(2, 1fr); } }

  /* ---- matchups + DonBot's picks ---- */
  .matchup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .matchup { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  .matchup-side { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 4px 0; font-size: 14px; }
  .matchup-side .meta-line { color: var(--text-faint); font-size: 11.5px; font-family: 'IBM Plex Mono', monospace; }
  .matchup-side .pct { font-family: 'IBM Plex Mono', monospace; color: var(--text-dim); }
  .matchup-side.picked .pct { color: var(--accent); font-weight: 600; }
  .pick-badge { font: 600 9.5px 'IBM Plex Mono', monospace; letter-spacing: 0.06em; text-transform: uppercase; color: var(--bg); background: var(--accent); border-radius: 3px; padding: 2px 5px; margin-left: 6px; white-space: nowrap; }
  .prob-bar { display: flex; height: 4px; border-radius: 2px; overflow: hidden; background: var(--surface-2); margin-top: 8px; }
  .prob-bar i { display: block; background: var(--text-faint); }
  .prob-bar i.fav { background: var(--accent); }
  .matchup-tag { font: 500 10px 'IBM Plex Mono', monospace; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-faint); margin-bottom: 4px; }
  .matchup-tag.hot { color: var(--tier-f); }
  .title-note { color: var(--text-dim); letter-spacing: 0.04em; }
  @media (max-width: 720px) { .matchup-grid { grid-template-columns: 1fr; } }

  /* ---- standings extras ---- */
  .spark { display: block; }
  tr.cut td { border-bottom: 2px dashed var(--accent-dim); }
  .table-note { color: var(--text-faint); font-size: 11.5px; margin-top: 8px; font-family: 'IBM Plex Mono', monospace; }
  .streak-w { color: var(--tier-a); }
  .streak-l { color: var(--tier-f); }
  .two-col > div { min-width: 0; overflow-x: auto; }
  @media (max-width: 720px) {
    .hide-sm { display: none; }
    .two-col .team-logo { display: none; }
    .two-col th, .two-col td { padding-left: 4px; padding-right: 4px; }
  }

  /* ---- buttons + filter chips ---- */
  .more-btn, .chip {
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--text-dim);
    cursor: pointer;
    font: 500 11.5px 'IBM Plex Mono', monospace;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border-radius: 999px;
    padding: 7px 14px;
  }
  .more-btn:hover, .chip:hover { color: var(--text); border-color: var(--accent-dim); }
  .more-btn { display: block; margin: 14px auto 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .chip.active { color: var(--bg); background: var(--accent); border-color: var(--accent); }
  .tweet.extra, tr.extra { display: none; }
  .show-all .tweet.extra { display: grid; }
  .show-all tr.extra { display: table-row; }
  .tweet-pin { grid-column: 1 / -1; color: var(--text-faint); font-size: 12px; margin: 0 0 -6px 60px; }

  td.date-cell {
    color: var(--text-dim);
    white-space: nowrap;
  }

  footer {
    padding: 30px 0 50px;
    color: var(--text-faint);
    font-size: 12px;
    font-family: 'IBM Plex Mono', monospace;
    text-align: center;
  }

  .loading {
    padding: 80px 20px;
    text-align: center;
    color: var(--text-faint);
    font-family: 'IBM Plex Mono', monospace;
  }
  /* ---- Tabs + League History ---- */
  .tabs { border-bottom: 1px solid var(--line); background: var(--bg); }
  .tabs .wrap { display: flex; gap: 4px; overflow-x: auto; }
  .tab { white-space: nowrap; flex-shrink: 0; }
  .tab {
    background: none;
    border: 0;
    border-bottom: 2px solid transparent;
    color: var(--text-dim);
    cursor: pointer;
    font-family: 'Oswald', sans-serif;
    font-size: 15px;
    letter-spacing: 0.06em;
    padding: 14px 16px 12px;
    text-transform: uppercase;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  .rb-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .rb-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: 4px;
    padding: 16px 18px 8px;
  }
  .rb-card h3 { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
  .rb-rank { width: 26px; color: var(--text-faint); font-family: 'IBM Plex Mono', monospace; }
  .rb-card tr:first-child .rb-rank,
  .rb-card tr:first-child td.num { color: var(--accent); }
  .rb-sub { color: var(--text-faint); font-size: 12px; }
  @media (max-width: 720px) { .rb-grid { grid-template-columns: 1fr; } }

  /* ---- Playoff Race ---- */
  .pr-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 4px; }
  .pr-head .section-title { margin-bottom: 0; }
  .pr-sub { color: var(--text-faint); font-size: 12px; margin-bottom: 12px; }
  .pr-sec { margin-top: 34px; }
  .pr-table td, .pr-table th { padding: 8px 4px; }
  .pr-table td.pr-name { max-width: 0; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pr-table .team-logo { display: none; }
  .pr-nm { display: flex; align-items: center; min-width: 0; }
  .pr-nm > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pr-nm .pr-status { flex: none; }
  .pr-gotw th { white-space: nowrap; }
  .pr-table td.num { white-space: nowrap; }
  .pr-pct { font-weight: 600; }
  .pr-hi { color: var(--tier-a); } .pr-mid { color: var(--accent); } .pr-lo { color: var(--tier-f); } .pr-none { color: var(--text-faint); }
  .pr-status { font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; letter-spacing: 0.05em; padding: 1px 4px; border-radius: 3px; margin-left: 5px; vertical-align: 1px; }
  .pr-status.in { background: var(--tier-a); color: var(--bg); }
  .pr-status.bye { background: var(--accent); color: var(--bg); }
  .pr-status.out { background: var(--surface-2); color: var(--text-faint); }
  .pr-chg { font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; margin-left: 4px; }
  .pr-chg.up { color: var(--tier-a); } .pr-chg.down { color: var(--tier-f); }
  .pr-rec-chg { color: var(--accent); font-weight: 600; }
  tr.pr-moved td { background: rgba(244,185,62,0.07); }
  @keyframes prFlash { from { background: rgba(244,185,62,0.45); } to { background: rgba(244,185,62,0.07); } }
  tr.pr-flash td { animation: prFlash 0.9s ease-out; }
  .pr-pill { background: var(--accent); border: 0; border-radius: 12px; color: var(--bg); cursor: pointer; font: 600 11px 'IBM Plex Mono', monospace; padding: 4px 10px; white-space: nowrap; }
  .pr-gotw { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 4px; padding: 12px 14px; }
  .pr-gotw .m { font-family: 'Oswald', sans-serif; font-size: 16px; margin-bottom: 6px; }
  .pr-gotw .m span { color: var(--text-faint); font-size: 13px; }
  .pr-weeks { display: flex; gap: 6px; margin-bottom: 12px; }
  .pr-wk { flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; color: var(--text-dim); cursor: pointer; font: 500 13px 'Oswald', sans-serif; letter-spacing: 0.06em; padding: 8px 4px; }
  .pr-wk.active { border-color: var(--accent); color: var(--accent); }
  .pr-wk i { font-style: normal; background: var(--accent); color: var(--bg); border-radius: 8px; font: 600 10px 'IBM Plex Mono', monospace; padding: 0 5px; margin-left: 4px; }
  .pr-game { display: grid; grid-template-columns: 1fr 18px 1fr; gap: 4px; align-items: center; margin-bottom: 6px; }
  .pr-game .at { color: var(--text-faint); font-size: 11px; text-align: center; }
  .pr-pick { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; color: var(--text); cursor: pointer; font: inherit; font-size: 13px; min-height: 44px; padding: 6px 8px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pr-pick.won { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; }
  .pr-pick.lost { opacity: 0.35; text-decoration: line-through; }
  .pr-sticky { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; background: var(--surface-2); border-top: 2px solid var(--accent); box-shadow: 0 -8px 24px rgba(0,0,0,0.45); padding: 8px 0 calc(8px + env(safe-area-inset-bottom)); }
  .pr-sticky-head { display: flex; justify-content: space-between; align-items: center; font: 11px 'IBM Plex Mono', monospace; letter-spacing: 0.06em; color: var(--text-dim); margin-bottom: 4px; }
  .pr-sticky-head button { background: none; border: 0; color: var(--accent); cursor: pointer; font: inherit; padding: 4px 0 4px 14px; }
  .pr-mover { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; line-height: 1.6; }
  .pr-mover span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pr-mover b { font-family: 'IBM Plex Mono', monospace; font-weight: 600; white-space: nowrap; }
  .pr-spacer { height: 130px; }
</style>
</head>
<body>

<div id="app">
  <div class="loading">Loading league data…</div>
</div>

<script>
async function loadData() {
  const app = document.getElementById('app');
  try {
    const res = await fetch('data/data.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('data.json not found');
    const data = await res.json();
    render(data);
  } catch (err) {
    app.innerHTML = `
      <div class="loading">
        Couldn't load league data yet.<br>
        <span style="font-size:12px">(${err.message} — has the weekly job run at least once?)</span>
      </div>`;
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

function formatDate(iso) {
  try {
    const d = new Date(iso);
    return d.toLocaleString('en-US', {
      weekday: 'short', month: 'short', day: 'numeric',
      hour: 'numeric', minute: '2-digit'
    });
  } catch {
    return iso;
  }
}

function formatShortDate(ts) {
  try {
    const d = new Date(ts);
    if (isNaN(d.getTime())) return '—';
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  } catch {
    return '—';
  }
}

const MOVE_LABELS = { WAIVER: ['Waiver claim', 'add'], FREE_AGENT: ['Free agent', 'add'], DROP: ['Drop', 'drop'], TRADE: ['Trade', 'trade'] };

function teamCell(team, owner) {
  return `${escapeHtml(team)}${owner ? `<div class="txn-sub">${escapeHtml(owner)}</div>` : ''}`;
}

function transactionRow(t, i) {
  const extra = i >= 12;
  const [label, cls] = MOVE_LABELS[t.kind] || ['Move', ''];
  let team, details;
  if (t.kind === 'TRADE') {
    const sides = t.sides || [];
    team = sides.map(sd => teamCell(sd.team, sd.owner)).join('<div class="txn-sub">⇄</div>');
    details = sides.map(sd => `<div class="txn-line"><span class="txn-sub">${escapeHtml(sd.team)} gets</span> ${escapeHtml((sd.gets || []).join(', '))}</div>`).join('');
  } else {
    team = teamCell(t.team, t.owner);
    const adds = (t.adds || []).map(n => `<div class="txn-line"><span class="txn-add">+</span> ${escapeHtml(n)}${t.bid ? `<span class="txn-bid">$${t.bid} FAAB</span>` : ''}</div>`);
    const drops = (t.drops || []).map(n => `<div class="txn-line"><span class="txn-drop">−</span> ${escapeHtml(n)}</div>`);
    details = adds.concat(drops).join('');
  }
  return `<tr data-kind="${escapeHtml(t.kind)}"${extra ? ' class="extra"' : ''}>
    <td class="date-cell mono">${formatShortDate(t.date)}</td>
    <td>${team}</td>
    <td><span class="action-tag ${cls}">${label}</span></td>
    <td>${details}</td>
  </tr>`;
}

function deltaCell(change, spots) {
  if (change === null || change === undefined || isNaN(change)) return '<td class="num delta flat">—</td>';
  const dir = change > 0.005 ? 'up' : change < -0.005 ? 'down' : 'flat';
  const arrow = dir === 'up' ? '▲' : dir === 'down' ? '▼' : '–';
  const sign = change > 0 ? '+' : change < 0 ? '−' : '';
  const sp = spots ? `<span class="spots">(${spots > 0 ? '↑' : '↓'}${Math.abs(spots)})</span>` : '';
  return `<td class="num delta ${dir}" title="Change in score since last week">${arrow} ${sign}${Math.abs(change).toFixed(2)}${sp}</td>`;
}

let RACE = null;

// Team name with its ESPN logo, plus a crown for the defending champ.
function teamTag(name) {
  const info = TEAMS[name] || {};
  const initials = String(name || '?').trim().slice(0, 2).toUpperCase();
  const blank = `<span class="team-logo blank">${escapeHtml(initials)}</span>`;
  const logo = info.logo
    ? `<img class="team-logo" src="${escapeHtml(info.logo)}" alt="" loading="lazy" referrerpolicy="no-referrer" data-initials="${escapeHtml(initials)}">`
    : blank;
  const crown = info.champ ? '<span class="crown" title="Defending champion">👑</span>' : '';
  return `<span class="team">${logo}<span>${escapeHtml(name)}${crown}</span></span>`;
}

// Tiny line showing a team's power rank week by week (up = better).
function sparkline(ranks, teamCount) {
  if (!Array.isArray(ranks) || ranks.length < 2) return '';
  const w = 64, h = 20, pad = 3;
  const x = i => pad + i * (w - 2 * pad) / (ranks.length - 1);
  const y = r => pad + (r - 1) * (h - 2 * pad) / Math.max(teamCount - 1, 1);
  const pts = ranks.map((r, i) => `${x(i).toFixed(1)},${y(r).toFixed(1)}`).join(' ');
  const last = ranks.length - 1;
  const trend = ranks[last] < ranks[0] ? 'var(--tier-a)' : ranks[last] > ranks[0] ? 'var(--tier-f)' : 'var(--text-dim)';
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Rank by week: ${ranks.join(', ')}">
    <title>Rank by week: ${ranks.join(' → ')}</title>
    <polyline points="${pts}" fill="none" stroke="${trend}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(last).toFixed(1)}" cy="${y(ranks[last]).toFixed(1)}" r="2.2" fill="${trend}"/>
  </svg>`;
}

function matchupCard(g, isLock) {
  const side = t => {
    const picked = g.pick === t.team;
    const bits = [t.record, t.power_rank ? `PR #${t.power_rank}` : '', t.avg ? `${t.avg} ppg` : ''].filter(Boolean).join(' · ');
    return `<div class="matchup-side ${picked ? 'picked' : ''}">
      <div>${teamTag(t.team)}${picked ? '<span class="pick-badge">DonBot\'s pick</span>' : ''}<div class="meta-line">${escapeHtml(bits)}</div></div>
      <div class="pct">${t.win_prob}%</div>
    </div>`;
  };
  const tag = isLock ? '<div class="matchup-tag">🔒 Lock of the week</div>'
    : g.confidence <= 55 ? '<div class="matchup-tag hot">🔥 Toss-up</div>' : '';
  return `<div class="matchup">${tag}${side(g.away)}${side(g.home)}
    <div class="prob-bar"><i class="${g.pick === g.away.team ? 'fav' : ''}" style="width:${g.away.win_prob}%"></i><i class="${g.pick === g.home.team ? 'fav' : ''}" style="width:${g.home.win_prob}%"></i></div>

}

// Stable "engagement" numbers per post so they don't jump around on refresh.
function fakeCount(text, salt, max) {
  let h = salt;
  for (const c of text) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  const n = h % max;
  return n >= 1000 ? (n / 1000).toFixed(1) + 'K' : String(n);
}

// ---- Show more / filters / broken logos ----
function wireInteractions() {
  const app = document.getElementById('app');
  app.addEventListener('click', e => {
    const more = e.target.closest('[data-more]');
    if (more) {
      document.getElementById(more.dataset.more === 'news' ? 'news-feed' : 'txn-log').classList.add('show-all');
      more.remove();
      return;
    }
    const chip = e.target.closest('.chip');
    if (chip) {
      const log = document.getElementById('txn-log');
      const kind = chip.dataset.filter;
      log.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c === chip));
      log.querySelectorAll('tbody tr').forEach(tr => { tr.hidden = kind !== 'ALL' && tr.dataset.kind !== kind; });
      if (kind !== 'ALL') {           // a filter shows every matching move, not just the newest dozen
        log.classList.add('show-all');
        const btn = log.querySelector('[data-more]');
        if (btn) btn.remove();
      }
    }
  });
  // A team logo that fails to load falls back to the team's initials.
  app.addEventListener('error', e => {
    const img = e.target;
    if (!(img instanceof HTMLImageElement) || !img.classList.contains('team-logo')) return;
    const span = document.createElement('span');
    span.className = 'team-logo blank';
    span.textContent = img.dataset.initials || '';
    img.replaceWith(span);
  }, true);
}

async function loadHistory(host) {
  try {

    const d = await res.json();
    const yrs = d.seasons || [];

    host.innerHTML = `<div class="empty-state">Couldn't load the record book (${escapeHtml(err.message)}). Has the weekly job run since it was added?</div>`;
  }
}

// ---- Playoff Race ----
// Same math as scripts/playoff_odds.py, so the What-If picker can re-run it
// in the browser. A seeded random generator keeps results steady between taps.
function seededRandom(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function simulateRace(race, picks, sims = 10000) {
  const rnd = seededRandom(race.through_week * 7919 + 1);
  const gauss = () => {
    const u = 1 - rnd(), v = rnd();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  };
  const names = Object.keys(race.teams);
  const made = {}, bye = {}, seeds = {};
  names.forEach(n => { made[n] = 0; bye[n] = 0; seeds[n] = new Array(names.length).fill(0); });
  for (let s = 0; s < sims; s++) {
    const w = {}, pf = {};
    names.forEach(n => { w[n] = race.teams[n].wins; pf[n] = race.teams[n].pf; });
    race.remaining.forEach(wk => wk.games.forEach(([home, away]) => {
      let hs = race.teams[home].mean + race.spread * gauss();
      let as = race.teams[away].mean + race.spread * gauss();
      const forced = picks[pickKey(wk.week, home, away)];
      // A locked-in pick keeps the simulated scores but hands the higher one to your winner.
      if ((forced === home && hs < as) || (forced === away && as < hs)) [hs, as] = [as, hs];
      w[hs >= as ? home : away] += 1;
      pf[home] += hs; pf[away] += as;
    }));
    names.slice().sort((a, b) => (w[b] - w[a]) || (pf[b] - pf[a])).forEach((n, i) => {
      seeds[n][i]++;
      if (i < race.spots) made[n]++;
      if (i < race.byes) bye[n]++;
    });
  }
  const out = {};
  names.forEach(n => {
    out[n] = { playoffs: 100 * made[n] / sims, bye: 100 * bye[n] / sims, seeds: seeds[n].map(c => 100 * c / sims) };
  });
  return out;
}

function pickKey(week, home, away) { return `${week}|${home}|${away}`; }

// Mathematically certain labels (mirrors clinch_status in playoff_odds.py).
function clinchStatus(race, picks) {
  const wins = {}, left = {};
  Object.keys(race.teams).forEach(n => { wins[n] = race.teams[n].wins; left[n] = 0; });
  race.remaining.forEach(wk => wk.games.forEach(([home, away]) => {
    const forced = picks[pickKey(wk.week, home, away)];
    if (forced) wins[forced]++;
    else { left[home]++; left[away]++; }
  }));
  const status = {};
  Object.keys(wins).forEach(n => {
    const lo = wins[n], hi = wins[n] + left[n];
    const others = Object.keys(wins).filter(o => o !== n);
    const canCatch = others.filter(o => wins[o] + left[o] >= lo).length;
    const sureAhead = others.filter(o => wins[o] > hi).length;
    status[n] = (race.byes && canCatch < race.byes) ? 'bye' : canCatch < race.spots ? 'in' : sureAhead >= race.spots ? 'out' : '';
  });
  return status;
}

function fmtPct(v, status) {
  if (status === 'out') return '—';
  if (status === 'in' || status === 'bye') return '100%';
  if (v >= 99.5) return '>99%';
  if (v < 0.5) return '<1%';
  return Math.round(v) + '%';
}

function pctClass(v, status) {
  if (status === 'out') return 'pr-none';
  return v >= 80 ? 'pr-hi' : v >= 30 ? 'pr-mid' : v >= 0.5 ? 'pr-lo' : 'pr-none';
}

function statusChip(st) {
  return st === 'bye' ? '<span class="pr-status bye">BYE</span>'
    : st === 'in' ? '<span class="pr-status in">IN</span>'
    : st === 'out' ? '<span class="pr-status out">OUT</span>' : '';
}

function chg(d) {
  return d ? `<span class="pr-chg ${d > 0 ? 'up' : 'down'}">${d > 0 ? '▲' : '▼'}${Math.abs(d)}</span>` : '';
}

// Records with your picks added, sorted like the standings (wins, then current Points For).
function scenarioRows(race, picks) {
  const rec = {};
  race.table.forEach(r => { rec[r.team] = { team: r.team, wins: r.wins, losses: r.losses, pf: r.pf, added: 0 }; });
  race.remaining.forEach(wk => wk.games.forEach(([home, away]) => {
    const w = picks[pickKey(wk.week, home, away)];
    if (!w) return;
    const l = w === home ? away : home;
    rec[w].wins++; rec[w].added++; rec[l].losses++; rec[l].added++;
  }));
  return Object.values(rec).sort((a, b) => (b.wins - a.wins) || (a.losses - b.losses) || (b.pf - a.pf));
}

function oddsTable(race, rows, odds, status, base, prev) {
  const body = rows.map((r, i) => {
    const o = odds[r.team], st = status[r.team];
    const d = base ? Math.round(o.playoffs - base[r.team].playoffs) : 0;
    const flash = prev && Math.abs(o.playoffs - prev[r.team].playoffs) >= 1;
    const cls = [i + 1 === race.spots ? 'cut' : '', d ? 'pr-moved' : '', flash ? 'pr-flash' : ''].join(' ');
    return `<tr class="${cls}">
      <td class="rank-badge">${i + 1}</td>
      <td class="pr-name"><div class="pr-nm"><span>${escapeHtml(r.team)}</span>${statusChip(st)}</div></td>
      <td class="num ${r.added ? 'pr-rec-chg' : ''}">${r.wins}-${r.losses}</td>
      <td class="num"><span class="pr-pct ${pctClass(o.playoffs, st)}">${fmtPct(o.playoffs, st)}</span>${chg(d)}</td>
      ${race.byes ? `<td class="num">${st === 'out' ? '—' : fmtPct(o.bye, st === 'bye' ? 'bye' : '')}</td>` : ''}
    </tr>`;
  }).join('');
  return `<table class="pr-table">
    <thead><tr><th>#</th><th>Team</th><th class="num">W-L</th><th class="num">Playoffs</th>${race.byes ? '<th class="num">Bye</th>' : ''}</tr></thead>
    <tbody>${body}</tbody>
  </table>`;
}

function shortName(name) {
  const n = String(name).trim();
  return n.length > 10 ? n.slice(0, 9) + '…' : n;
}

function renderRace(host) {
  const race = RACE;
  if (!race) {
    host.innerHTML = '<div class="empty-state">The playoff race shows up here during the regular season once the weekly job has run.</div>';
    return;
  }
  const baseOdds = {}, baseStatus = {};
  race.table.forEach(r => { baseOdds[r.team] = r; baseStatus[r.team] = r.status; });
  const weeksLeft = race.remaining.length;
  const nextWeek = weeksLeft ? race.remaining[0].week : null;
  const sub = `${weeksLeft ? `${weeksLeft} week${weeksLeft > 1 ? 's' : ''} left` : 'Regular season final'} · top ${race.spots} make it${race.byes ? ` · top ${race.byes} get${race.byes > 1 ? '' : 's'} a bye` : ''} · ties go to Points For`;

  const g = race.game_of_week;
  const gotw = g && g.teams_affected.length ? `
    <div class="pr-gotw">
      <div class="m">${escapeHtml(g.away)} <span>at</span> ${escapeHtml(g.home)}</div>
      <table class="pr-table"><thead><tr><th>Playoff odds</th><th class="num">${escapeHtml(shortName(g.away))} win</th><th class="num">${escapeHtml(shortName(g.home))} win</th></tr></thead><tbody>
      ${g.teams_affected.map(t => `<tr><td class="pr-name">${escapeHtml(t.team)}</td><td class="num">${fmtPct(t.if_away_wins)}</td><td class="num">${fmtPct(t.if_home_wins)}</td></tr>`).join('')}
      </tbody></table>
    </div>` : '';

  const stakes = (race.stakes || []).filter(s => Math.abs(s.if_win - s.if_lose) >= 5).slice(0, 8);
  const stakesHtml = stakes.length ? `<table class="pr-table">
      <thead><tr><th>Team</th><th class="num">Now</th><th class="num">Win</th><th class="num">Lose</th></tr></thead>
      <tbody>${stakes.map(s => `<tr>
        <td class="pr-name">${escapeHtml(s.team)}</td>
        <td class="num">${fmtPct(s.now)}</td>
        <td class="num pr-hi">${fmtPct(s.if_win)}</td>
        <td class="num pr-lo">${fmtPct(s.if_lose)}</td>
      </tr>`).join('')}</tbody>
    </table>` : '<div class="empty-state">Nobody\'s playoff odds hinge on this week.</div>';

  host.innerHTML = `
    <div id="pr-top">
      <div class="pr-head"><div class="section-title" id="pr-title">PLAYOFF ODDS</div><button class="pr-pill" id="pr-clear" hidden></button></div>
      <div class="pr-sub" id="pr-sub">${escapeHtml(sub)}</div>
      <div id="pr-table"></div>
    </div>
    ${nextWeek ? `
    <div class="pr-sec">
      <div class="section-title">WHAT IF? · TAP THE WINNERS</div>
      <div class="pr-sub">Pick results and the odds table above updates. Tap a pick again to undo.</div>
      <div class="pr-weeks">${race.remaining.map((wk, i) => `<button class="pr-wk ${i === 0 ? 'active' : ''}" data-wk="${wk.week}">WEEK ${wk.week}</button>`).join('')}</div>
      <div id="pr-games"></div>
    </div>
    ${gotw ? `<div class="pr-sec"><div class="section-title">GAME OF THE WEEK · WK ${nextWeek}</div>${gotw}</div>` : ''}
    <div class="pr-sec">
      <div class="section-title">WHAT'S ON THE LINE · WK ${nextWeek}</div>
      ${stakesHtml}
    </div>
    <div class="pr-spacer" id="pr-spacer" hidden></div>
    <div class="pr-sticky" id="pr-sticky" hidden><div class="wrap">
      <div class="pr-sticky-head"><span id="pr-sticky-title"></span><span><button id="pr-jump">TABLE ↑</button><button id="pr-reset">RESET</button></span></div>
      <div id="pr-movers"></div>
    </div></div>` : ''}
  `;

  const picks = {};
  const noPicks = weeksLeft ? simulateRace(race, {}) : null;   // same random draws, so ▲/▼ only reflects your picks
  let prev = null;
  let activeWeek = nextWeek;
  const $ = sel => host.querySelector(sel);

  function drawGames() {
    const wk = race.remaining.find(w => w.week === activeWeek);
    $('#pr-games').innerHTML = wk.games.map(([home, away]) => {
      const key = pickKey(wk.week, home, away);
      const w = picks[key];
      const btn = t => `<button class="pr-pick ${w ? (w === t ? 'won' : 'lost') : ''}" data-key="${escapeHtml(key)}" data-team="${escapeHtml(t)}">${escapeHtml(t)}</button>`;
      return `<div class="pr-game">${btn(away)}<span class="at">@</span>${btn(home)}</div>`;
    }).join('');
    host.querySelectorAll('.pr-wk').forEach(b => {
      const n = Object.keys(picks).filter(k => k.startsWith(b.dataset.wk + '|')).length;
      b.classList.toggle('active', Number(b.dataset.wk) === activeWeek);
      b.innerHTML = `WEEK ${b.dataset.wk}${n ? `<i>${n}</i>` : ''}`;
    });
  }

  function update() {
    const n = Object.keys(picks).length;
    if (!n) {
      $('#pr-table').innerHTML = oddsTable(race, race.table, baseOdds, baseStatus, null, null);
      $('#pr-title').textContent = 'PLAYOFF ODDS';
      $('#pr-clear').hidden = true;
      if (weeksLeft) { $('#pr-sticky').hidden = true; $('#pr-spacer').hidden = true; drawGames(); }
      prev = null;
      return;
    }
    const scen = simulateRace(race, picks);
    const status = clinchStatus(race, picks);
    $('#pr-table').innerHTML = oddsTable(race, scenarioRows(race, picks), scen, status, noPicks, prev);
    $('#pr-title').textContent = 'YOUR SCENARIO';
    $('#pr-clear').hidden = false;
    $('#pr-clear').textContent = `${n} PICK${n > 1 ? 'S' : ''} · RESET ✕`;
    prev = scen;
    drawGames();

    const movers = Object.keys(scen)
      .map(t => ({ t, now: scen[t].playoffs, was: noPicks[t].playoffs, st: status[t] }))
      .filter(m => Math.abs(Math.round(m.now - m.was)) >= 1)
      .sort((a, b) => Math.abs(b.now - b.was) - Math.abs(a.now - a.was))
      .slice(0, 3);
    $('#pr-sticky').hidden = false;
    $('#pr-spacer').hidden = false;
    $('#pr-sticky-title').textContent = `YOUR SCENARIO · ${n} PICK${n > 1 ? 'S' : ''}`;
    $('#pr-movers').innerHTML = movers.length ? movers.map(m =>
      `<div class="pr-mover"><span>${escapeHtml(m.t)}</span><b>${fmtPct(m.was)} → ${fmtPct(m.now, m.st)}${chg(Math.round(m.now - m.was))}</b></div>`
    ).join('') : '<div class="pr-mover"><span>No playoff odds move with these picks.</span></div>';
  }

  const reset = () => { Object.keys(picks).forEach(k => delete picks[k]); update(); };
  $('#pr-clear').addEventListener('click', reset);
  if (weeksLeft) {
    $('#pr-reset').addEventListener('click', reset);
    $('#pr-jump').addEventListener('click', () => $('#pr-top').scrollIntoView({ behavior: 'smooth', block: 'start' }));
    host.querySelector('.pr-weeks').addEventListener('click', e => {
      const b = e.target.closest('.pr-wk');
      if (!b) return;
      activeWeek = Number(b.dataset.wk);
      drawGames();
    });
    $('#pr-games').addEventListener('click', e => {
      const b = e.target.closest('.pr-pick');
      if (!b) return;
      if (picks[b.dataset.key] === b.dataset.team) delete picks[b.dataset.key];
      else picks[b.dataset.key] = b.dataset.team;
      update();
    });
  }
  update();
}

function setupTabs() {
  const app = document.getElementById('app');
  const ticker = app.querySelector('.ticker-outer');
  if (!ticker) return; // league data didn't load, so there is nothing to tab between

  const hubSections = [...app.querySelectorAll(':scope > section')];
  const makePanel = id => {
    const sec = document.createElement('section');
    sec.hidden = true;
    sec.innerHTML = `<div class="wrap" id="${id}"><div class="empty-state">Loading…</div></div>`;
    app.insertBefore(sec, app.querySelector('footer'));
    return sec;
  };
  const panels = { race: makePanel('race-host'), history: makePanel('history-host') };
  const loaders = {
    race: () => renderRace(document.getElementById('race-host')),
    history: () => loadHistory(document.getElementById('history-host')),
  };

  const nav = document.createElement('nav');
  nav.className = 'tabs';
  nav.innerHTML = '<div class="wrap"><button class="tab active" data-tab="hub">League Hub</button><button class="tab" data-tab="race">Playoff Race</button><button class="tab" data-tab="history">League History</button></div>';
  ticker.after(nav);

  const loaded = {};
  nav.addEventListener('click', e => {
    const btn = e.target.closest('.tab');
    if (!btn) return;
    const tab = btn.dataset.tab;
    nav.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b === btn));
    hubSections.forEach(s => { s.hidden = tab !== 'hub'; });
    Object.entries(panels).forEach(([k, sec]) => { sec.hidden = tab !== k; });
    if (loaders[tab] && !loaded[tab]) {
      loaded[tab] = true;
      loaders[tab]();
    }
  });
}

wireInteractions();
loadData().then(setupTabs);

</script>
